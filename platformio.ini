
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_port = COM15
upload_port = COM15

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DEI_CLASSIFIER_ALLOCATION_STATIC=1
    -Ilib/VuDieuAnhSang_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
    -Ilib/VuDieuAnhSang_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -IC:/Users/khanh/.platformio/packages/framework-arduinoespressif32/libraries/Network/src

lib_ldf_mode = deep+
; Web dashboard: framework libraries listed explicitly so WiFi finds Network.h
lib_deps =
    Networking
    WiFi
    FS
    WebServer
    ESPmDNS
